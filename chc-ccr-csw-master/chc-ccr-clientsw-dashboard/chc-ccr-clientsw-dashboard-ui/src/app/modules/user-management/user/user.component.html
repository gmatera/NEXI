
<div class="grid-container">
    <h1 class="mat-h1">User Management</h1>

    <div fxLayout="row" fxLayoutAlign="center center" class="container">
        <mat-card class="main-card">
            <mat-card-title fxLayout.gt-xs="row" fxLayout.xs="column">
                <h2 class="mat-h2">User Management</h2>
            </mat-card-title>
            <mat-card-content>
                <div class="table-container">



                    <form [formGroup]="filterForm" (ngSubmit)="onSubmitFilter()">
                        <mat-grid-list cols="6" rowHeight="70px">
                            <mat-grid-tile [colspan]="1" [rowspan]="1">
                                <mat-form-field appearance="outline" color="accent">
                                    <mat-label>UserName</mat-label>
                                    <input matInput placeholder="insert username" formControlName="username" >
                                </mat-form-field>
                            </mat-grid-tile>
                        </mat-grid-list>

                        <mat-grid-list cols="6" rowHeight="70px">
                            <mat-grid-tile [colspan]="6" [rowspan]="1">
                                <div>
                                    <button mat-raised-button>
                                        <mat-icon>filter_list</mat-icon>
                                    </button> 
                                    &nbsp;
                                    <button mat-button color="accent" type="button" (click)="clearFilter()" >
                                        <mat-icon>clear</mat-icon>
                                    </button>
                                    &nbsp;
                                    <a routerLink="/user/edit" mat-button color="accent">
                                        Add new User
                                   </a> 
                                </div>
                            </mat-grid-tile>
                        </mat-grid-list>
                    </form>    

                                     
                    <mat-table mat-table [dataSource]="dataSource" class="mat-elevation-z8 data-table" matSort #sort="matSort" (matSortChange)="sortData(sort)">
                        <ng-container matColumnDef="id" > 
                            <th mat-text-column mat-header-cell *matHeaderCellDef justify="end">Edit </th>
                            <td mat-cell *matCellDef="let element" > 
                                <button mat-raised-button class="success" (click)="editUser(element)">
                                    <mat-icon>edit</mat-icon>
                                </button> 
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="username">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>username</th>
                            <td mat-cell *matCellDef="let element"> {{element.username}} </td>
                        </ng-container>
                        <ng-container matColumnDef="fullName">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>fullName</th>
                            <td mat-cell *matCellDef="let element"> {{ element.fullName }} </td>
                        </ng-container>
                        <ng-container matColumnDef="roles">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>roles</th>
                            <td mat-cell *matCellDef="let element"> {{ element.roles }} </td>
                        </ng-container>
                        <tr mat-header-row *matHeaderRowDef="userdisplayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: userdisplayedColumns;"></tr>
                    </mat-table>

                  <mat-paginator [pageSizeOptions]="pageSizeOptions"
                    [length]="length"
                    [pageSize]="pageSize"
                    showFirstLastButtons aria-label="Select page of periodic elements"
                    (page)="handlePageEvent($event)">
                 </mat-paginator>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
