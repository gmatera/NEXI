
<div class="grid-container">
    <h1 class="mat-h1">Configuration</h1>

    <div fxLayout="row" fxLayoutAlign="center center" class="container">
        <mat-card class="main-card">
            <mat-card-title fxLayout.gt-xs="row" fxLayout.xs="column">
                <h2 class="mat-h2">Service Registry Configuration</h2>
            </mat-card-title>
            <mat-card-content>
                <div class="table-container">
                   
                    <!-- Config filter -->
<!--                     <form [formGroup]="filterForm" (ngSubmit)="onSubmitFilter()">
                        <mat-grid-list cols="6" rowHeight="70px">
                            <mat-grid-tile [colspan]="1" [rowspan]="1">
                                <mat-form-field appearance="outline" color="accent">
                                    <mat-label>Prova</mat-label>
                                    <input matInput placeholder="insert Prova" formControlName="Prova" >
                                </mat-form-field>
                            </mat-grid-tile>
                        </mat-grid-list>     
                    </form>    --> 

                    <mat-table mat-table [dataSource]="service.dataSource" class="mat-elevation-z8 data-table" matSort #sort="matSort" (matSortChange)="sortData(sort)">
                        <ng-container matColumnDef="id" >
                            <th mat-text-column mat-header-cell *matHeaderCellDef mat-sort-header justify="end">Action </th>
                            <td mat-cell *matCellDef="let element" > 
                              <!--   <button mat-raised-button class="success" (click)="editConfiguration(element)">
                                    <mat-icon>edit</mat-icon>
                                </button>  -->
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="groupId">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Group Id</th>
                            <td mat-cell *matCellDef="let element"> {{element.groupId}} </td>
                        </ng-container>
                        <ng-container matColumnDef="hostName">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Host Name</th>
                            <td mat-cell *matCellDef="let element"> {{ element.hostName }} </td>
                        </ng-container>
                        <ng-container matColumnDef="lastUpdate">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Update</th>
                            <td mat-cell *matCellDef="let element"> {{ element.lastUpdate }} </td>
                        </ng-container>
                        <ng-container matColumnDef="port">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Port</th>
                            <td mat-cell *matCellDef="let element"> {{ element.port}} </td>
                        </ng-container>
                        <ng-container matColumnDef="roles">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Roles</th>
                            <td mat-cell *matCellDef="let element"> {{ element.roles}} </td>
                        </ng-container>
                        <ng-container matColumnDef="serviceStatus">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Service Status</th>
                            <td mat-cell *matCellDef="let element"> {{ element.serviceStatus}} </td>
                        </ng-container>
                        <tr mat-header-row *matHeaderRowDef="serviceRegDisplayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: serviceRegDisplayedColumns;"></tr>
                    </mat-table>
<!-- 
                  <mat-paginator [pageSizeOptions]="service.pageSizeOptions"
                    [length]="service.length"
                    [pageSize]="service.pageSize"
                    showFirstLastButtons aria-label="Select page of periodic elements"
                    (page)="handlePageEvent($event)">
                 </mat-paginator> -->
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
