
<div class="grid-container">
    <h1 class="mat-h1">Configuration</h1>

    <div fxLayout="row" fxLayoutAlign="center center" class="container">
        <mat-card class="main-card">
            <mat-card-title fxLayout.gt-xs="row" fxLayout.xs="column">
                <h2 class="mat-h2">System Configuration</h2>
            </mat-card-title>
            <mat-card-content>
                <div class="table-container">
                   
                    <!-- Config filter -->
                    <form [formGroup]="filterForm" (ngSubmit)="onSubmitFilter()">
                        <mat-grid-list cols="6" rowHeight="70px">
                            <mat-grid-tile [colspan]="1" [rowspan]="1">
                                <mat-form-field appearance="outline" color="accent">
                                    <mat-label>Param Key</mat-label>
                                    <input matInput placeholder="insert paramKey" formControlName="paramKey" >
                                </mat-form-field>
                            </mat-grid-tile>
                        </mat-grid-list>

                        <mat-grid-list cols="6" rowHeight="70px">
                            <mat-grid-tile [colspan]="6" [rowspan]="1">
                                <div>
                                    <button mat-raised-button>
                                        <mat-icon>filter_list</mat-icon>
                                    </button> 
                                    &nbsp;
                                    <button mat-button color="accent" type="button" (click)="clearFilter()" >
                                        <mat-icon>clear</mat-icon>
                                    </button>
                                    &nbsp;
                                    <a routerLink="/configuration/system/edit" mat-button color="accent" *ngIf="auth.isAdmin">
                                        Add new configuration
                                   </a> 
                                </div>
                            </mat-grid-tile>
                        </mat-grid-list>
                    </form>    

                    <mat-table mat-table [dataSource]="service.dataSource" class="mat-elevation-z8" matSort>
                        <ng-container matColumnDef="id" >
                            <th mat-text-column mat-header-cell *matHeaderCellDef mat-sort-header justify="end">Action </th>
                            <td mat-cell *matCellDef="let element" > 
                                <button mat-raised-button class="success" (click)="editConfiguration(element)">
                                    <mat-icon>edit</mat-icon>
                                </button> 
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="paramKey">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>paramKey</th>
                            <td mat-cell *matCellDef="let element"> {{element.paramKey}} </td>
                        </ng-container>
                        <ng-container matColumnDef="paramValue">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>paramValue</th>
                            <td mat-cell *matCellDef="let element"> {{ element.paramValue }} </td>
                        </ng-container>
                       
            
                        <tr mat-header-row *matHeaderRowDef="systemdisplayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: systemdisplayedColumns;"></tr>
                    </mat-table>

                  <mat-paginator [pageSizeOptions]="service.pageSizeOptions"
                    [length]="service.length"
                    [pageSize]="service.pageSize"
                    showFirstLastButtons aria-label="Select page of periodic elements"
                    (page)="handlePageEvent($event)">
                 </mat-paginator>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
