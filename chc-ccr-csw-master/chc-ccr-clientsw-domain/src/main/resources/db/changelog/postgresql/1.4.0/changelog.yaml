databaseChangeLog:
  - property:
      dbms: postgresql
      name: DB_USER
      value: CSW
      
  - changeSet:
      id: 01_alter_table.sql
      author: Eng
      dbms: postgresql
      changes:
      - sqlFile:
          encoding: utf8
          endDelimiter: \n/\s*\n|\n/\s*$
          path: 01_alter_table.sql
          relativeToChangelogFile: true
          splitStatements: true
          stripComments: true

          