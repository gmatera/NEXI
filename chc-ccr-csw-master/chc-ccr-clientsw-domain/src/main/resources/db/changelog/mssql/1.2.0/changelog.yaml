databaseChangeLog:
  - property:
      dbms: mssql
      name: DB_USER
      value: CSW

  - changeSet:
      id: 04_csw_alter_table.sql
      author: Eng
      dbms: mssql
      changes:
      - sqlFile:
          encoding: utf8
          endDelimiter: \n/\s*\n|\n/\s*$
          path: 04_csw_alter_table.sql
          relativeToChangelogFile: true
          splitStatements: true
          stripComments: true
