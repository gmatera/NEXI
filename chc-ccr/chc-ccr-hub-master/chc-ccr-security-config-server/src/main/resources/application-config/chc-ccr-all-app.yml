spring:
  application:
    name: chc-ccr-all-app

  datasource: 
    # POSTGRESS
    url: jdbc:postgresql://chc_database:5432/ccr
    username: postgres
    password: postgres
    # ORACLE
#    url: jdbc:oracle:thin:@//chc_database:1521/XE
#    username: CHC_CCR_OWN_OBJ
#    password: CHC_CCR_OWN_OBJ
  jpa:
    show-sql: 'false'
    open-in-view: false
  liquibase:
    enabled: 'true'
    change-log: classpath:db/changelog/ccr-changelog-master.yaml
  
  # for inbound multipart files
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
      location: /tmp/chc/ccr/inbound
         
  output:
    ansi:
      enabled: 'ALWAYS'
server:
  port: '50001'

eureka: 
  client:
    enabled: true
    serviceUrl: 
      defaultZone: http://localhost:8082/eureka/
    region: default
    registryFetchIntervalSeconds: 5
  instance:
    metadata-map:
      management.context-path: /private-intmon
    status-page-url-path: /private-intmon/info
    health-check-url-path: /private-intmon/health
    hostname: localhost
    preferIpAddress:  false

management:
  context-path: /private-intmon
  health:
    diskspace:
      enabled: true
    jms:
      enabled: true
    rabbit:
      enabled: false
  endpoints:
    web:
      base-path: /private-intmon
      exposure:
        include: "*"
        
logging:
  level:
    org:
      springframework:
        web:
          servlet:
            mvc:
              method:
                annotation: DEBUG
          nodeValue: INFO
        security: INFO
    com:
      cbi: DEBUG

springdoc:
  swagger-ui:
    enabled: 'true'

integration_test_active: 'true'


