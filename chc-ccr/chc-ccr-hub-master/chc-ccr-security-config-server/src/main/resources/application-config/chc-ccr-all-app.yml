########### INBOUND
# update also the values in chc-ccr-orchestrator-simulator
#Form CCR to Orchestrator
orchestrator_exchange: chc_cmd_ccr2_exchange
orchestrator_routing_key: chc_cmd_ccr2orc
#Form CCR to dashboard
dashboard_exchange: chc_evn_ccr2_distributor_exchange
dashboard_routing_key: chc_evn_ccr2dsh_batch
# TODO da gestire
dashboard_routing_key_online: chc_evn_ccr2dsh_online
