chc_id_generator_service_url: http://localhost:60005
########### INBOUND END

########### OUTBOUND
local_storage_path: /tmp/chc/ccr/outbound
# From Orchestrator to CCR
ccr_queue: chc_cmd_orc2ccr_queue

# number of thread for each RabbitMQ listener, can be 1-5 or 5 or more
outbound_mq_listener_concurrency: 5
########### OUTBOUND END

########### POLLER
fixedPollerDelay: 5000
max_retry_attempts: 2


# Proxy server configuration for outgoing http calls
proxy_host:
proxy_port:
proxy_user:
proxy_password: